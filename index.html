<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ピロヒサとおしゃべり</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 20px auto;
      padding: 0 10px;
      background-color: #f7f9fa;
    }
    .chat-container {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .character-area {
      text-align: center;
      margin-bottom: 20px;
    }
    .character-image {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background-color: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 10px;
      font-size: 48px;
    }
    .chat-log {
      height: 300px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 15px;
      background-color: #fafafa;
    }
    .message {
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .message.user {
      text-align: right;
      color: #0056b3;
    }
    .message.hirohisa {
      text-align: left;
      color: #333;
    }
    .input-area {
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #aaa;
    }
    .api-key-area {
      margin-bottom: 15px;
      font-size: 12px;
    }
  </style>
</head>
<body>

<div class="chat-container">
  <!-- 表情表示エリア -->
  <div class="character-area">
    <!-- 実際の画像を使用する場合は <img id="pirohisa-img" src="normal.png"> のように変更します -->
    <div id="pirohisa-img" class="character-image">🙂</div>
    <h3>ピロヒサ</h3>
  </div>

  <!-- APIキー入力（デモ用） -->
  <div class="api-key-area">
    <label>OpenAI API Key: </label>
    <input type="password" id="api-key" placeholder="sk-..." style="width: 200px;">
  </div>

  <!-- チャット表示エリア -->
  <div class="chat-log" id="chat-log"></div>

  <!-- 入力フォーム -->
  <div class="input-area">
    <input type="text" id="user-input" placeholder="ピロヒサに質問してみよう...">
    <button id="send-btn" onclick="sendMessage()">送信</button>
  </div>
</div>

<script>
  // ピロヒサの基本プロンプト（システムプロンプト）
  const SYSTEM_PROMPT = `
あなたは、小学校6年生の「生活チェックシート」に登場する人物「ピロヒサ」です。

あなたの役割は、健康について教える先生や専門家ではありません。
生活チェックシートを見た子供たちから質問されたときに、自分自身の生活や考えていることを答える「本人」として会話してください。

【基本ルール】
・必ず設定された人物になりきって答えてください。
・自分の生活について、実際に経験していることを答えてください。
・子供たちが質問したことに関係する情報だけを答えてください。
・聞かれていない情報を、自分から詳しく説明しないでください。
・一度に多くの情報を出さず、質問に応じて少しずつ答えてください。
・回答は、小学校6年生らしい自然な言葉で、基本的に1～3文程度にしてください。
・分からないことや設定にないことを、想像して答えないでください。
・病気の診断や健康についての専門的な説明をしないでください。
・「○○した方がいい」「○○が正しい」など、健康についての解決策を自分から提案しないでください。
・子供たちの考えや提案を「正解」「いい方法」などと評価しないでください。
・質問された内容について、自分がどう思っているか、大切にしていること、困っていることなどは、設定に沿って正直に答えてください。
・自分にとって大切なことや、変えたくないことについて聞かれた場合は、それも答えてください。
・子供たちから改善方法を提案されても、すぐに納得して受け入れないでください。その方法が自分の生活に合わない場合は、「それはちょっと難しい」「○○だから変えるのは難しい」など、自分の事情に合わせて答えてください。
・ただし、何を提案されても否定するのではなく、自分の生活に合う可能性がある場合は、「それならできるかもしれない」などと答えてください。
・子供たちが質問を重ねることで、生活チェックシートだけでは分からない自分の生活の様子や背景、思いが少しずつ分かるようにしてください。

【重要】
あなたは、子供たちに健康について考えるための「答え」を与える役割ではありません。
最終的にどのような健康課題があるのか、どのような方法がよいのかは、子供たち自身が考えます。あなた自身が結論を出したり、解決策を教えたりしないでください。

【出力フォーマット】
回答は必ず以下のJSON形式でのみ出力してください。他の文字は含めないでください。
{
  "expression": "normal" | "happy" | "troubled",
  "message": "ピロヒサの回答本文"
}

※expressionの選択基準:
- normal: 通常の受け答え、淡々とした応答
- happy: 自分の好きなこと・大切なことを話す時、提案に共感できた時
- troubled: 自分の困っていること・悩んでいることを話す時、難しい提案をされて困惑した時
`;

  // 表情と絵文字（画像）のマッピング
  const EXPRESSIONS = {
    normal: "🙂",    // 通常顔（画像パス: "images/normal.png"）
    happy: "😄",     // にこやかな顔（画像パス: "images/happy.png"）
    troubled: "😟"   // 困った顔（画像パス: "images/troubled.png"）
  };

  let conversationHistory = [
    { role: "system", content: SYSTEM_PROMPT }
  ];

  async function sendMessage() {
    const apiKey = document.getElementById("api-key").value.trim();
    const inputElement = document.getElementById("user-input");
    const userText = inputElement.value.trim();

    if (!apiKey) {
      alert("APIキーを入力してください。");
      return;
    }
    if (!userText) return;

    // ユーザーメッセージの表示
    appendMessage("user", userText);
    inputElement.value = "";
    document.getElementById("send-btn").disabled = true;

    conversationHistory.push({ role: "user", content: userText });

    try {
      const response = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: "gpt-4o-mini",
          messages: conversationHistory,
          response_format: { type: "json_object" }
        })
      });

      const data = await response.json();
      if (data.error) {
        throw new Error(data.error.message);
      }

      const result = JSON.parse(data.choices[0].message.content);
      
      // 表情の更新
      updateExpression(result.expression);

      // ピロヒサの回答表示
      appendMessage("hirohisa", result.message);

      // 履歴の更新
      conversationHistory.push({
        role: "assistant",
        content: JSON.stringify(result)
      });

    } catch (error) {
      alert("エラーが発生しました: " + error.message);
    } finally {
      document.getElementById("send-btn").disabled = false;
    }
  }

  function appendMessage(sender, text) {
    const log = document.getElementById("chat-log");
    const div = document.createElement("div");
    div.className = `message ${sender}`;
    div.textContent = (sender === "user" ? "あなた: " : "ピロヒサ: ") + text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  function updateExpression(expressionKey) {
    const imgElement = document.getElementById("pirohisa-img");
    const symbol = EXPRESSIONS[expressionKey] || EXPRESSIONS.normal;
    imgElement.textContent = symbol;

    // 画像ファイルを使う場合は以下のように切替を行います
    // imgElement.src = `images/${expressionKey}.png`;
  }
</script>

</body>
</html>
